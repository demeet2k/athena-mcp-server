name: H6 Cold Boot Qualification

on:
  pull_request:
    branches:
      - 'agent/h6-execution-cut03-green-v1'
    paths:
      - 'scripts/h6_cold_boot_witness.py'
      - 'spec/H6_COLD_BOOT_V1.json'
      - '.github/workflows/h6-cold-boot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile H6 cold boot witness
        run: python -m compileall -q athena_mcp scripts/h6_cold_boot_witness.py
      - name: Reopen durable H6 state in two clean Python processes
        env:
          PYTHONPATH: .
        run: python scripts/h6_cold_boot_witness.py
      - name: Upload cold boot receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h6-cold-boot-receipt
          path: h6_cold_boot_receipt.json
          if-no-files-found: error
