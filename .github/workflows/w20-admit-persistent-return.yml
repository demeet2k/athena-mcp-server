name: Validate W20 persistent return and IC10 review

on:
  workflow_dispatch:
    inputs:
      activation_packet_json:
        description: Secret-free W17 activation packet JSON
        required: true
        type: string
      provider_evidence_json:
        description: Secret-free provider evidence JSON
        required: true
        type: string
      provenance_witness_json:
        description: Secret-free provenance witness JSON
        required: true
        type: string
      provider_admission_json:
        description: Control-signed provider admission JSON
        required: true
        type: string
      provider_return_json:
        description: Provider-signed return JSON
        required: true
        type: string
      execution_authorization_json:
        description: Control-signed execution authorization JSON
        required: true
        type: string
      persistent_witness_json:
        description: Three-sample P10 persistent witness JSON
        required: true
        type: string
      control_admission_json:
        description: Control-signed external persistence admission JSON
        required: true
        type: string
      review_packet_json:
        description: Content-addressed IC10 review packet JSON
        required: true
        type: string
      ic10_decision_json:
        description: Separately signed nonpromotional IC10 decision JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-return-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=44,<48"

      - name: Materialize bounded secret-free records
        env:
          ACTIVATION_PACKET_JSON: ${{ inputs.activation_packet_json }}
          PROVIDER_EVIDENCE_JSON: ${{ inputs.provider_evidence_json }}
          PROVENANCE_WITNESS_JSON: ${{ inputs.provenance_witness_json }}
          PROVIDER_ADMISSION_JSON: ${{ inputs.provider_admission_json }}
          PROVIDER_RETURN_JSON: ${{ inputs.provider_return_json }}
          EXECUTION_AUTHORIZATION_JSON: ${{ inputs.execution_authorization_json }}
          PERSISTENT_WITNESS_JSON: ${{ inputs.persistent_witness_json }}
          CONTROL_ADMISSION_JSON: ${{ inputs.control_admission_json }}
          REVIEW_PACKET_JSON: ${{ inputs.review_packet_json }}
          IC10_DECISION_JSON: ${{ inputs.ic10_decision_json }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          records = {
              "activation-packet.json": "ACTIVATION_PACKET_JSON",
              "provider-evidence.json": "PROVIDER_EVIDENCE_JSON",
              "provenance-witness.json": "PROVENANCE_WITNESS_JSON",
              "provider-admission.json": "PROVIDER_ADMISSION_JSON",
              "provider-return.json": "PROVIDER_RETURN_JSON",
              "execution-authorization.json": "EXECUTION_AUTHORIZATION_JSON",
              "persistent-witness.json": "PERSISTENT_WITNESS_JSON",
              "control-admission.json": "CONTROL_ADMISSION_JSON",
              "review-packet.json": "REVIEW_PACKET_JSON",
              "ic10-decision.json": "IC10_DECISION_JSON",
          }
          root = Path("w20-input")
          root.mkdir()
          for filename, variable in records.items():
              raw = os.environ[variable]
              if len(raw.encode("utf-8")) > 65536:
                  raise ValueError(f"{filename} exceeds the 65536-byte bound")
              value = json.loads(raw)
              if not isinstance(value, dict):
                  raise ValueError(f"{filename} must contain one JSON object")
              (root / filename).write_text(
                  json.dumps(value, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Recheck frozen production state
        run: python scripts/w20_persistent_return_ic10.py --check-snapshot

      - name: Validate full W20 chain without committing or promoting
        run: |
          python scripts/w20_persistent_return_ic10.py \
            --activation-packet w20-input/activation-packet.json \
            --provider-evidence w20-input/provider-evidence.json \
            --provenance-witness w20-input/provenance-witness.json \
            --provider-admission w20-input/provider-admission.json \
            --provider-return w20-input/provider-return.json \
            --execution-authorization w20-input/execution-authorization.json \
            --persistent-witness w20-input/persistent-witness.json \
            --control-admission w20-input/control-admission.json \
            --review-packet w20-input/review-packet.json \
            --ic10-decision w20-input/ic10-decision.json \
            --output w20-return-ic10-preflight.json

      - name: Upload nonpromotional validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: w20-return-ic10-preflight-${{ github.sha }}
          path: w20-return-ic10-preflight.json
          if-no-files-found: error
          retention-days: 90
