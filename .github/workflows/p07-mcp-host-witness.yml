name: P07 MCP Host Witness

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-stdio-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out witnessed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MCP runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mcp[cli]>=1.0.0" "pytest>=8.0"

      - name: Launch live stdio host and capture P07 witness
        env:
          WITNESSED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/p07_mcp_host_witness.py \
            --output p07-mcp-host-witness.json \
            --timeout 120

      - name: Run federation and registration regressions
        run: |
          ATHENA_ROOT="$GITHUB_WORKSPACE" \
            python -m pytest \
              tests/test_federation_v2.py \
              tests/test_registration.py \
              -q

      - name: Publish witness summary
        if: always()
        run: |
          if test -f p07-mcp-host-witness.json; then
            {
              echo "## P07 live MCP host witness"
              echo
              echo '```json'
              python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path("p07-mcp-host-witness.json").read_text())
          summary = {
              "receipt_id": receipt["receipt_id"],
              "verdict": receipt["verdict"],
              "witnessed_commit": receipt["witnessed_commit"],
              "deployment": receipt["deployment"],
              "checks": receipt["checks"],
              "answer_provenance": receipt["answer_provenance"],
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p07-mcp-host-witness-${{ github.sha }}
          path: p07-mcp-host-witness.json
          if-no-files-found: error
          retention-days: 90
