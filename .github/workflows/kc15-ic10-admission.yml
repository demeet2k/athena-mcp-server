name: KC15 Trusted IC10 Admission

on:
  pull_request:
    branches:
      - 'agent/ic10-execution-cut04-i10-binding-v1'
    paths:
      - 'athena_mcp/inner_constitution.py'
      - 'spec/KC15_IC10_ADMISSION_V1.json'
      - 'scripts/kc15_ic10_admission_witness.py'
      - '.github/workflows/kc15-ic10-admission.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  kc15-observed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download provider-sealed 144-seat population receipt
        uses: actions/download-artifact@v4
        with:
          name: kc144-final-source-population-v1
          path: evidence/population
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31336281325
      - name: Download independent KC15 structural receipt
        uses: actions/download-artifact@v4
        with:
          name: kc15-independent-structural-witness-v1
          path: evidence/structural
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31336970525
      - name: Download KC15 interpretation receipt
        uses: actions/download-artifact@v4
        with:
          name: kc15-interpretation-review-v1
          path: evidence/interpretation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31337197769
      - name: Compile observed KC15 admission cartridge
        run: python -m compileall -q athena_mcp/inner_constitution.py scripts/kc15_ic10_admission_witness.py
      - name: Execute KC15 observed I01-I09 admission on exact head
        env:
          PYTHONPATH: .
        run: >-
          python scripts/kc15_ic10_admission_witness.py
          --population evidence/population/kc144_final_source_population_matrix_v1.json
          --structural evidence/structural/kc15_independent_witness_v1.json
          --interpretation evidence/interpretation/kc15_interpretation_review_v1.json
          --output kc15_ic10_admission_observed_v1.json
      - name: Upload exact-head KC15 observed admission packet
        uses: actions/upload-artifact@v4
        with:
          name: kc15-ic10-observed-exact-head
          path: kc15_ic10_admission_observed_v1.json
          if-no-files-found: error

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile repository and admission cartridges
        run: python -m compileall -q athena_mcp tests smoke.py scripts/qualify_github_head.py scripts/ic10_i10_binding.py scripts/kc15_ic10_admission_witness.py

  unit:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: '3'
      GIT_CONFIG_KEY_0: gc.auto
      GIT_CONFIG_VALUE_0: '0'
      GIT_CONFIG_KEY_1: maintenance.auto
      GIT_CONFIG_VALUE_1: 'false'
      GIT_CONFIG_KEY_2: gc.autoDetach
      GIT_CONFIG_VALUE_2: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Full unit suite
        run: python -m unittest discover -s tests -v

  critical-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: State/schema/CAS/cycle/surface invariants
        run: |
          python -m unittest discover -s tests -p 'test_state_foundation_unified.py' -v
          python -m unittest discover -s tests -p 'test_three_domain_cas_unified.py' -v
          python -m unittest discover -s tests -p 'test_cycle_unified.py' -v
          python -m unittest discover -s tests -p 'test_surface_composition_unified.py' -v
      - name: Startup/manifest/metadata/documentation invariants
        run: |
          python -m unittest discover -s tests -p 'test_self_test_unified.py' -v
          python -m unittest discover -s tests -p 'test_startup_health_unified.py' -v
          python -m unittest discover -s tests -p 'test_unified_manifest.py' -v
          python -m unittest discover -s tests -p 'test_metadata_consistency.py' -v
          python -m unittest discover -s tests -p 'test_documentation_consistency.py' -v
      - name: Promotion trust and exact-head invariants
        run: |
          python -m unittest discover -s tests -p 'test_github_promotion_verifier.py' -v
          python -m unittest discover -s tests -p 'test_promotion_unified.py' -v

  smoke:
    needs: [syntax, unit, critical-invariants]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: MCP smoke
        run: python smoke.py

  promotion-qualification:
    needs: [kc15-observed, syntax, unit, critical-invariants, smoke]
    runs-on: ubuntu-latest
    env:
      ATHENA_GITHUB_REPOSITORY: ${{ github.repository }}
      ATHENA_GITHUB_API_URL: ${{ github.api_url }}
      ATHENA_GITHUB_RUN_ID: ${{ github.run_id }}
      ATHENA_GITHUB_TOKEN: ${{ github.token }}
      ATHENA_PROMOTION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Create and replay host-verified PROMOTION.2 receipt
        run: python scripts/qualify_github_head.py --git-root . --output promotion-receipt.json
      - name: Upload trusted promotion receipt
        uses: actions/upload-artifact@v4
        with:
          name: kc15-ic10-promotion-receipt
          path: promotion-receipt.json
          if-no-files-found: error

  kc15-bind:
    needs: [kc15-observed, promotion-qualification]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download observed KC15 admission packet
        uses: actions/download-artifact@v4
        with:
          name: kc15-ic10-observed-exact-head
          path: .
      - name: Download trusted PROMOTION.2 receipt
        uses: actions/download-artifact@v4
        with:
          name: kc15-ic10-promotion-receipt
          path: .
      - name: Bind trusted I10 into KC15 structural claim
        env:
          PYTHONPATH: .
        run: >-
          python scripts/ic10_i10_binding.py
          --observed kc15_ic10_admission_observed_v1.json
          --promotion promotion-receipt.json
          --output kc15_ic10_admission_receipt_v1.json
      - name: Upload bounded KC15 IC10 admission receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kc15-ic10-admission-receipt-v1
          path: kc15_ic10_admission_receipt_v1.json
          if-no-files-found: error
