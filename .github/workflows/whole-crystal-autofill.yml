name: Validate KC144 whole-crystal structural autofill

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-whole-crystal-autofill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact MMLG2 catalog lock once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_registration.py')
          text = path.read_text(encoding='utf-8')
          old_tool = 'assert len(tools) == 300, f"Expected 300 tools, got {len(tools)}: {sorted(tools.keys())}"'
          new_tool = 'assert len(tools) == 312, f"Expected 312 tools, got {len(tools)}: {sorted(tools.keys())}"'
          old_resource = 'assert len(resources) == 55, f"Expected 55 resources, got {len(resources)}: {sorted(resources.keys())}"'
          new_resource = 'assert len(resources) == 58, f"Expected 58 resources, got {len(resources)}: {sorted(resources.keys())}"'
          if text.count(old_tool) != 1 or text.count(old_resource) != 1:
              raise SystemExit('registration count seam drift')
          text = text.replace(old_tool, new_tool).replace(old_resource, new_resource)

          marker = '    def test_core_tools_present(self):\n'
          addition = '''    def test_mmlg_v2_tools_present(self):
        tools = set(self.mcp._tool_manager._tools.keys())
        expected = {
            "mmlg_status", "mmlg_goals_list", "mmlg_goal_get",
            "mmlg_goal_next", "mmlg_episode_start", "mmlg_episode_observe",
            "mmlg_episode_score", "mmlg_episode_advance", "mmlg_episode_rollback",
            "mmlg_defects_list", "mmlg_receipts_verify", "mmlg_successor_compile",
        }
        missing = expected - tools
        assert not missing, f"Missing MMLG.2 tools: {missing}"

    def test_mmlg_v2_resources_present(self):
        resources = set(self.mcp._resource_manager._resources.keys())
        expected = {
            "athena://meta-ml-game/v2/goal-index",
            "athena://meta-ml-game/v2/status",
            "athena://meta-ml-game/v2/constitution",
        }
        missing = expected - resources
        assert not missing, f"Missing MMLG.2 resources: {missing}"

'''
          if text.count(marker) != 1 or 'def test_mmlg_v2_tools_present' in text:
              raise SystemExit('MMLG registration-test seam drift')
          path.write_text(text.replace(marker, addition + marker), encoding='utf-8')
          PY
          python -m py_compile tests/test_registration.py

      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check "mcp<2" cryptography pytest

      - name: Verify frozen source and law ledger
        run: python scripts/whole_crystal_autofill.py --status

      - name: Compile deterministic 144-cell fixed point
        run: python scripts/whole_crystal_autofill.py --fixed-point

      - name: Run direct Ω tests
        run: python -m pytest tests/test_whole_crystal_autofill.py -q

      - name: Verify MCP registration
        run: python -m pytest tests/test_registration.py -q

      - name: Commit exact catalog lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_registration.py
          git commit -m 'Lock MMLG v2 MCP catalog at 312 tools and 58 resources'
          git push origin HEAD:agent/meta-harness-2-mmlg2-mcp
