name: Validate KC144 whole-crystal structural autofill

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-whole-crystal-autofill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check "mcp<2" cryptography pytest

      - name: Verify frozen source and law ledger
        run: python scripts/whole_crystal_autofill.py --status

      - name: Compile deterministic 144-cell fixed point
        run: python scripts/whole_crystal_autofill.py --fixed-point

      - name: Run direct Ω tests
        run: python -m pytest tests/test_whole_crystal_autofill.py -q

      - name: Verify MCP registration
        run: python -m pytest tests/test_registration.py -q
