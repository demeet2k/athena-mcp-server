name: Validate KC144 whole-crystal structural autofill

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-whole-crystal-autofill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact MMLG3 serialization and catalog lock
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('MCP/crystal_108d/meta_ml_game_v3.py')
          text = runtime.read_text(encoding='utf-8')
          old = '            "adapters": deepcopy(SOURCE_ADAPTERS),\n'
          new = '''            "adapters": {
                name: {
                    **deepcopy(contract),
                    "required": sorted(contract["required"]),
                }
                for name, contract in SOURCE_ADAPTERS.items()
            },
'''
          if text.count(old) != 1:
              raise SystemExit('MMLG3 adapter serialization seam drift')
          runtime.write_text(text.replace(old, new), encoding='utf-8')

          path = Path('tests/test_registration.py')
          text = path.read_text(encoding='utf-8')
          old_tool = 'assert len(tools) == 312, f"Expected 312 tools, got {len(tools)}: {sorted(tools.keys())}"'
          new_tool = 'assert len(tools) == 323, f"Expected 323 tools, got {len(tools)}: {sorted(tools.keys())}"'
          old_resource = 'assert len(resources) == 58, f"Expected 58 resources, got {len(resources)}: {sorted(resources.keys())}"'
          new_resource = 'assert len(resources) == 62, f"Expected 62 resources, got {len(resources)}: {sorted(resources.keys())}"'
          if text.count(old_tool) != 1 or text.count(old_resource) != 1:
              raise SystemExit('registration count seam drift')
          text = text.replace(old_tool, new_tool).replace(old_resource, new_resource)

          marker = '    def test_core_tools_present(self):\n'
          addition = '''    def test_mmlg_v3_tools_present(self):
        tools = set(self.mcp._tool_manager._tools.keys())
        expected = {
            "mmlg3_status", "mmlg3_quests_list", "mmlg3_quest_get",
            "mmlg3_quest_claim", "mmlg3_observation_ingest",
            "mmlg3_observations_list", "mmlg3_letter_search_plan",
            "mmlg3_canary_compile", "mmlg3_return_compile",
            "mmlg3_quest_rollback", "mmlg3_receipts_verify",
        }
        missing = expected - tools
        assert not missing, f"Missing MMLG.3 tools: {missing}"

    def test_mmlg_v3_resources_present(self):
        resources = set(self.mcp._resource_manager._resources.keys())
        expected = {
            "athena://meta-ml-game/v3/guild-hall/projection",
            "athena://meta-ml-game/v3/guild-hall/quest-board",
            "athena://meta-ml-game/v3/source-adapters",
            "athena://meta-ml-game/v3/status",
        }
        missing = expected - resources
        assert not missing, f"Missing MMLG.3 resources: {missing}"

'''
          if text.count(marker) != 1 or 'def test_mmlg_v3_tools_present' in text:
              raise SystemExit('MMLG3 registration-test seam drift')
          path.write_text(text.replace(marker, addition + marker), encoding='utf-8')
          PY
          python -m py_compile MCP/crystal_108d/meta_ml_game_v3.py tests/test_meta_ml_game_v3_guild_hall.py tests/test_registration.py

      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check "mcp<2" cryptography pytest

      - name: Verify frozen source and law ledger
        run: python scripts/whole_crystal_autofill.py --status

      - name: Compile deterministic 144-cell fixed point
        run: python scripts/whole_crystal_autofill.py --fixed-point

      - name: Run direct Ω tests
        run: python -m pytest tests/test_whole_crystal_autofill.py -q

      - name: Verify MCP registration
        run: python -m pytest tests/test_registration.py -q

      - name: Run direct MMLG2 adversarial acceptance
        run: python -m pytest tests/test_meta_ml_game_v2_mcp.py -q

      - name: Run direct MMLG3 Guild Hall acceptance
        run: python -m pytest tests/test_meta_ml_game_v3_guild_hall.py -q

      - name: Commit exact MMLG3 integration lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MCP/crystal_108d/meta_ml_game_v3.py tests/test_registration.py
          git commit -m 'Lock MMLG3 Guild Hall catalog at 323 tools and 62 resources'
          git push origin HEAD:agent/meta-harness-3-guild-hall-144
