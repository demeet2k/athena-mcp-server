name: Historical Release Distribution V3.4

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  historical-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Verify frozen V3.4 source contract remains available
        run: |
          python - <<'PY'
          import json, pathlib
          manifest=json.loads(pathlib.Path('release/v3.4.0.json').read_text())
          notes=pathlib.Path('release/v3.4.0.md').read_text()
          assert manifest['version']=='3.4.0'
          assert manifest['runtime']['manifest']=='ATHENA.RUNTIME.UNIFIED.11'
          assert manifest['runtime']['collective_frontier']=='COLLECTIVE_CALIBRATED_V15'
          assert 'ATHENA 3.4.0' in notes
          assert 'Collective Calibrated V15' in notes
          print('HISTORICAL V3.4 CONTRACT PASS')
          PY
      - name: Enforce historical-only authority
        run: |
          python - <<'PY'
          print('V3.4 workflow is historical/read-only. Current V16/V3.5 publication authority lives only in release-v3.5.yml and still requires manual workflow_dispatch on exact current master.')
          PY
