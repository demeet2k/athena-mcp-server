name: KC144 authoritative carrier ingest

on:
  push:
    branches:
      - agent/kc144-topological-command-hub
    paths:
      - .github/workflows/kc144-bootstrap.yml
      - scripts/kc144_ingest_carrier.py

permissions:
  contents: write

concurrency:
  group: kc144-authoritative-carrier-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kc144-topological-command-hub
          fetch-depth: 0
      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Decode and verify KC144 archive
        env:
          KC144_CARRIER_URL: 'https://oaisdmntprwestus3.blob.core.windows.net/files/00000000-882c-81fd-8774-2e535957af95/raw?se=2026-08-08T07%3A19%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=019fe010-eda1-7b1a-a3f2-e2d824f0cfc8&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T03%3A44%3A54Z&ske=2026-08-09T03%3A44%3A54Z&sks=b&skv=2026-02-06&sig=JWbY4JwSpnM0LMtLJAWW4mQLdTCC%2BMh3ZfAKpRDKo0E%3D'
        run: >-
          python scripts/kc144_ingest_carrier.py
          "$KC144_CARRIER_URL"
          athena_mcp/data/kc144-core-registries.tar.xz
      - name: Commit exact carrier and retire bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum athena_mcp/data/kc144-core-registries.tar.xz | awk '{print $1}')" = "312d984d988797311ac42e1d8b2323b9d8e87877c1c05679a93189c18e861f7d"
          rm .github/workflows/kc144-bootstrap.yml
          git config user.name "athena-kc144-bot"
          git config user.email "athena-kc144-bot@users.noreply.github.com"
          git add athena_mcp/data/kc144-core-registries.tar.xz scripts/kc144_ingest_carrier.py .github/workflows/kc144-bootstrap.yml
          git commit -m "feat(kc144): ingest authoritative registry carrier"
          git push origin HEAD:agent/kc144-topological-command-hub
