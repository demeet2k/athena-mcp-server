name: Release Distribution

on:
  push:
    branches:
      - 'agent/aor-collective-unified'
    paths:
      - 'release/v3.1.0.json'
      - 'release/v3.1.0.md'
      - 'Dockerfile'
      - 'deploy/**'
      - 'scripts/generate_sbom.py'
      - '.github/workflows/release.yml'
      - 'tests/test_release_distribution.py'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: athena-release-v3.1.0
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'demeet2k/athena-mcp-server'
    runs-on: ubuntu-latest
    env:
      MANIFEST_FILE: release/v3.1.0.json
      NOTES_FILE: release/v3.1.0.md
      IMAGE: ghcr.io/demeet2k/athena-mcp-server
      TARGET_BRANCH: agent/aor-collective-unified
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate release manifest and exact source head
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, tomllib
          root = pathlib.Path('.')
          manifest = json.loads((root / 'release/v3.1.0.json').read_text())
          project = tomllib.loads((root / 'pyproject.toml').read_text())['project']
          assert manifest['schema'] == 'ATHENA.RELEASE.DISTRIBUTION.2'
          assert manifest['version'] == project['version'] == '3.1.0'
          assert manifest['tag'] == 'v' + manifest['version']
          assert manifest['package']['name'] == project['name']
          assert manifest['package']['entrypoint'] == project['scripts']['athena-mcp'] == 'athena_mcp.deployment_hub:main'
          assert manifest['package']['http_entrypoint'] == project['scripts']['athena-mcp-http'] == 'athena_mcp.http_host:main'
          assert manifest['source']['target_branch'] == 'agent/aor-collective-unified'
          assert manifest['container']['repository'] == 'ghcr.io/demeet2k/athena-mcp-server'
          assert manifest['release']['draft'] is False
          assert manifest['release']['prerelease'] is False
          print('RELEASE MANIFEST PASS', manifest['tag'])
          PY
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          BRANCH_HEAD=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test -n "$BRANCH_HEAD"
          test "$BRANCH_HEAD" = "$GITHUB_SHA"
          VERSION=$(python -c "import json; print(json.load(open('$MANIFEST_FILE'))['version'])")
          TAG=$(python -c "import json; print(json.load(open('$MANIFEST_FILE'))['tag'])")
          TITLE=$(python -c "import json; print(json.load(open('$MANIFEST_FILE'))['title'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"
          if git ls-remote --exit-code origin "refs/tags/$TAG" > /tmp/existing-tag 2>/dev/null; then
            TAG_TARGET=$(cut -f1 /tmp/existing-tag)
            test "$TAG_TARGET" = "$GITHUB_SHA"
          fi

      - name: Run complete repository test corpus
        run: python -m unittest discover -s tests -v

      - name: Build wheel from declared backend
        run: python -m pip wheel --no-deps . -w dist

      - name: Clean-install and verify composed package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/athena-release-wheel
          python -m pip install --no-deps --target /tmp/athena-release-wheel dist/*.whl
          cd /tmp
          PYTHONPATH=/tmp/athena-release-wheel python - <<'PY'
          import importlib.resources, tempfile
          import athena_mcp
          from athena_mcp.deployment_hub import DeploymentHubServer
          from athena_mcp.kc144_registry_pack import verify_pack
          assert athena_mcp.__version__ == '3.1.0'
          carrier = importlib.resources.files('athena_mcp').joinpath('data/kc144-core-registries.tar.xz')
          assert carrier.is_file(), carrier
          registry = verify_pack(deep=True)
          assert registry['status'] == 'PASS', registry
          with tempfile.NamedTemporaryFile(suffix='.db') as handle:
              server = DeploymentHubServer(handle.name)
              try:
                  init = server.handle({'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2025-11-25'}})['result']
                  assert init['serverInfo']['version'] == '3.1.0', init
                  assert init['serverInfo']['httpAdapter'] == 'ATHENA.JSONRPC.HTTP.ADAPTER.1', init
                  names = {item['name'] for item in server.handle({'jsonrpc':'2.0','id':2,'method':'tools/list'})['result']['tools']}
                  for name in ('athena_gp_hyperfit','athena_system_upgrade_plan','athena_kc144_hub_validate','athena_deployment_manifest'):
                      assert name in names, name
              finally:
                  server.store.close()
          print('CLEAN PACKAGE PASS', carrier)
          PY

      - name: Generate application SBOM and base release assets
        shell: bash
        run: |
          set -euo pipefail
          cp "$MANIFEST_FILE" dist/release-manifest.json
          cp athena_mcp/data/kc144-core-registries.tar.xz dist/kc144-core-registries.tar.xz
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -type f -print -quit)
          test -n "$WHEEL"
          python scripts/generate_sbom.py "$WHEEL" --output dist/application-sbom.spdx.json

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish immutable multi-platform container
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=mode=max \
            --sbom=true \
            --build-arg VERSION="$VERSION" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag "$IMAGE:$VERSION" \
            --push \
            --metadata-file /tmp/build-metadata.json \
            .
          IMAGE_DIGEST=$(python - <<'PY'
          import json
          value = json.load(open('/tmp/build-metadata.json'))
          digest = value.get('containerimage.digest')
          if not isinstance(digest, str) or not digest.startswith('sha256:') or len(digest) != 71:
              raise SystemExit(f'invalid containerimage.digest: {digest!r}')
          print(digest)
          PY
          )
          IMAGE_REF="$IMAGE@$IMAGE_DIGEST"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"
          docker buildx imagetools inspect "$IMAGE_REF" > /tmp/image-inspect.txt

      - name: Render exact-digest deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE_REF"
          python deploy/render.py \
            --image "$IMAGE_REF" \
            --output dist/deployment-manifest.yaml \
            --receipt /tmp/deployment-render-receipt.json
          grep -F "$IMAGE_REF" dist/deployment-manifest.yaml
          test "$(grep -Foc "$IMAGE_REF" dist/deployment-manifest.yaml)" = 1

      - name: Prepare release attestations and checksums
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, hashlib, json, os, pathlib
          manifest = json.loads(pathlib.Path(os.environ['MANIFEST_FILE']).read_text())
          wheels = glob.glob('dist/*.whl')
          assert len(wheels) == 1, wheels
          wheel = pathlib.Path(wheels[0])
          carrier = pathlib.Path('dist/kc144-core-registries.tar.xz')
          release_manifest = pathlib.Path('dist/release-manifest.json')
          sbom = pathlib.Path('dist/application-sbom.spdx.json')
          deployment = pathlib.Path('dist/deployment-manifest.yaml')
          render_receipt = json.loads(pathlib.Path('/tmp/deployment-render-receipt.json').read_text())
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          container_attestation = {
              'schema': 'ATHENA.CONTAINER.ATTESTATION.1',
              'repository': os.environ['IMAGE'],
              'image_ref': os.environ['IMAGE_REF'],
              'image_digest': os.environ['IMAGE_DIGEST'],
              'release_commit': os.environ['GITHUB_SHA'],
              'platforms': manifest['container']['platforms'],
              'buildkit_provenance': True,
              'buildkit_sbom': True,
              'deployment_manifest_sha256': sha(deployment),
              'render_receipt': render_receipt,
              'boundary': 'OCI publication and digest binding are distribution evidence, not host activation, empirical truth, or Y1 authority.',
          }
          pathlib.Path('dist/container-attestation.json').write_text(json.dumps(container_attestation, indent=2, sort_keys=True) + '\n')
          release_attestation = {
              'schema': 'ATHENA.RELEASE.ATTESTATION.2',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'release_commit': os.environ['GITHUB_SHA'],
              'release_ref': os.environ['GITHUB_REF'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'version': manifest['version'],
              'tag': manifest['tag'],
              'predecessor_release_commit': manifest['source']['predecessor_release_commit'],
              'predecessor_ci_run': manifest['source']['predecessor_ci_run'],
              'image_ref': os.environ['IMAGE_REF'],
              'artifacts': {
                  wheel.name: sha(wheel),
                  carrier.name: sha(carrier),
                  release_manifest.name: sha(release_manifest),
                  sbom.name: sha(sbom),
                  deployment.name: sha(deployment),
              },
              'gates': {
                  'unit_corpus': 'PASS',
                  'wheel_build': 'PASS',
                  'clean_install': 'PASS',
                  'registry_reconstruction': 'PASS',
                  'deployment_hub_surface': 'PASS',
                  'multi_platform_image_publish': 'PASS',
                  'digest_capture': 'PASS',
                  'deployment_render': 'PASS',
              },
              'boundary': 'Distribution attestation is not deployment, empirical truth, or Y1 authority.',
          }
          pathlib.Path('dist/release-attestation.json').write_text(json.dumps(release_attestation, indent=2, sort_keys=True) + '\n')
          PY
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          )
          python - <<'PY'
          import json, pathlib
          manifest = json.loads(pathlib.Path('release/v3.1.0.json').read_text())
          observed = {path.name for path in pathlib.Path('dist').iterdir() if path.is_file()}
          required = set(manifest['release']['required_assets'])
          assert required <= observed, {'required': sorted(required), 'observed': sorted(observed)}
          print('RELEASE ASSETS PASS', sorted(required))
          PY

      - name: Create exact-head tag and publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH_HEAD=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$BRANCH_HEAD" = "$GITHUB_SHA"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /tmp/tag.json 2>/dev/null; then
            TAG_TARGET=$(python -c "import json; print(json.load(open('/tmp/tag.json'))['object']['sha'])")
            test "$TAG_TARGET" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" > /tmp/tag.json
          fi
          TAG_TARGET=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          test "$TAG_TARGET" = "$GITHUB_SHA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"
          fi

      - name: Verify published release and immutable image identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_TARGET=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          test "$TAG_TARGET" = "$GITHUB_SHA"
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,url,assets > /tmp/release.json
          docker buildx imagetools inspect "$IMAGE_REF" > /tmp/image-readback.txt
          python - <<'PY'
          import json, os
          release = json.load(open('/tmp/release.json'))
          manifest = json.load(open(os.environ['MANIFEST_FILE']))
          assert release['tagName'] == manifest['tag'], release
          assert release['isDraft'] is False, release
          assert release['isPrerelease'] is False, release
          observed = {item['name'] for item in release['assets']}
          required = set(manifest['release']['required_assets'])
          assert required <= observed, {'required': sorted(required), 'observed': sorted(observed)}
          assert os.environ['IMAGE_REF'].endswith('@' + os.environ['IMAGE_DIGEST'])
          print('RELEASE PASS', release['url'], os.environ['IMAGE_REF'], sorted(observed))
          PY
