name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Unit tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/athena-tests.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            tail -n 60 /tmp/athena-tests.log > /tmp/athena-tail.log
            msg=$(python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/athena-tail.log').read_text(errors='replace').replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(s[:12000])
          PY
            )
            echo "::error title=ATHENA unit-test failure::$msg"
            exit "$code"
          fi
      - name: Smoke
        run: python smoke.py
