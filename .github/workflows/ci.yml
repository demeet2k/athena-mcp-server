name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "mcp[cli]>=1.0.0" pytest

      - name: Run repository tests
        id: repository_tests
        continue-on-error: true
        env:
          ATHENA_ROOT: ${{ github.workspace }}
        run: |
          set +e
          pytest tests/ -v --tb=short --maxfail=1 > repository-tests-${{ matrix.python-version }}.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run KC144 V7 tests
        id: kc144_tests
        continue-on-error: true
        env:
          ATHENA_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}/MCP
        run: |
          set +e
          pytest MCP/tests/test_kc144_v7_runtime.py -v --tb=short --maxfail=1 > kc144-tests-${{ matrix.python-version }}.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-python-${{ matrix.python-version }}
          path: |
            repository-tests-${{ matrix.python-version }}.log
            kc144-tests-${{ matrix.python-version }}.log
          if-no-files-found: error

      - name: Enforce test results
        if: always()
        run: |
          echo "repository_exit=${{ steps.repository_tests.outputs.exit_code }}"
          echo "kc144_exit=${{ steps.kc144_tests.outputs.exit_code }}"
          test "${{ steps.repository_tests.outputs.exit_code }}" = "0"
          test "${{ steps.kc144_tests.outputs.exit_code }}" = "0"
