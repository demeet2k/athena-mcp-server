name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "mcp[cli]>=1.0.0" pytest numpy

      - name: Run repository tests
        env:
          ATHENA_ROOT: ${{ github.workspace }}
        run: |
          set -o pipefail
          pytest tests/ -v --tb=short 2>&1 | tee repository-tests-${{ matrix.python-version }}.log

      - name: Run KC144 V7 and V8 tests
        if: always()
        env:
          ATHENA_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}/MCP
        run: |
          set -o pipefail
          pytest MCP/tests/test_kc144_v7_runtime.py MCP/tests/test_kc144_v8_runtime.py -v --tb=short 2>&1 | tee kc144-tests-${{ matrix.python-version }}.log

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-python-${{ matrix.python-version }}
          path: |
            repository-tests-${{ matrix.python-version }}.log
            kc144-tests-${{ matrix.python-version }}.log
          if-no-files-found: warn
