name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Unit tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/athena-tests.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/athena-tests.log').read_text(errors='replace')
          marker='======================================================================'
          failure=s[s.find(marker):] if marker in s else '\n'.join(s.splitlines()[-100:])
          failure=failure.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(failure[:20000])
          PY
            )
            echo "::error title=ATHENA unit-test traceback::$msg"
            exit "$code"
          fi
      - name: Smoke
        run: python smoke.py
