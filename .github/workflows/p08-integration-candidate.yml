name: Validate P08 persistent MCP candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify both admitted parents
        run: |
          git merge-base --is-ancestor \
            3b32a648e41edc75f7a8d048e84a35948cff3a4c \
            "$CANDIDATE_COMMIT"
          git merge-base --is-ancestor \
            2f79ddf0f513777b121290c44bd53e1d63d27d7f \
            "$CANDIDATE_COMMIT"
          test "$(git show -s --format=%P e705aaed854b3c17f0f5323a9f299d1a2257f8a7)" = \
            "3b32a648e41edc75f7a8d048e84a35948cff3a4c 2f79ddf0f513777b121290c44bd53e1d63d27d7f"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "mcp[cli]>=1.28.0,<2" \
            "cryptography>=44,<48" \
            "pytest>=8.0" \
            "starlette>=0.48,<2" \
            "uvicorn>=0.35,<1"

      - name: Validate receipts and Python surfaces
        run: |
          python -m json.tool \
            .athena/receipts/p07-mcp-host-witness.json >/dev/null
          python -m json.tool \
            .athena/receipts/p07-host-package.json >/dev/null
          python -m json.tool \
            .athena/receipts/p08-integration-candidate.json >/dev/null
          python -m json.tool \
            .athena/receipts/w11-source-mount-consumer.json >/dev/null
          python -m json.tool \
            .athena/receipts/w12-live-provider-return.json >/dev/null
          python -m json.tool \
            .athena/receipts/w13-blind-memory-and-endpoint-gate.json >/dev/null
          python -m json.tool \
            .athena/receipts/w14-memory-digest-capsule-endpoint-binding.json >/dev/null
          python -m json.tool \
            .athena/receipts/w12-cross-lineage-unification.json >/dev/null
          python -m json.tool \
            .athena/receipts/w14-memory-digest-capsule.json >/dev/null
          python -m json.tool \
            .athena/receipts/w14-control-return-closure.json >/dev/null
          python -m json.tool \
            .athena/receipts/w15-capsule-blind-replay-ingress.json >/dev/null
          python -m json.tool \
            .athena/receipts/w15-endpoint-binding-reconciliation.json >/dev/null
          python -m json.tool \
            .athena/receipts/w16-replay-ledger-authority-evidence-adjunction.json >/dev/null
          python -m json.tool \
            .athena/receipts/w15-capsule-blind-replay-authority-ingress.json >/dev/null
          python -m json.tool \
            .athena/receipts/w16-capsule-index-repair-authorized-witness-ingress.json >/dev/null
          python -m json.tool \
            .athena/receipts/w17-evidence-provenance-protected-dispatch-gate.json >/dev/null
          python -m json.tool \
            .athena/receipts/w18-provider-adapter-persistent-witness-return.json >/dev/null
          python -m json.tool \
            .athena/receipts/w18-provider-adapter-trust-anchor.json >/dev/null
          python -m json.tool \
            .athena/receipts/w18-provider-trust-convergence.json >/dev/null
          python -m json.tool \
            .athena/receipts/w19-provider-admission-execution-gate.json >/dev/null
          python -m json.tool \
            .athena/receipts/w20-persistent-return-ic10-gate.json >/dev/null
          python -m json.tool \
            .athena/receipts/w21-ledger-commit-promotion-handoff.json >/dev/null
          python -m json.tool \
            .athena/receipts/w22-independent-authority-return.json >/dev/null
          python -m json.tool \
            .athena/receipts/w23-promotion-execution-handoff.json >/dev/null
          python -m json.tool \
            .athena/receipts/w23-promotion-execution-handoff-hardening.json >/dev/null
          python -m json.tool \
            .athena/receipts/w24-execution-deployment-rollback-readback.json >/dev/null
          python -m json.tool \
            .athena/receipts/w24-execution-deployment-rollback-readback-hardening.json >/dev/null
          python -m json.tool \
            .athena/receipts/w25-persistent-promotion-settlement.json >/dev/null
          python -m json.tool \
            .athena/receipts/w25-persistent-promotion-settlement-hardening.json >/dev/null
          python -m json.tool \
            .athena/receipts/w26-control-ledger-ic10-review.json >/dev/null
          python -m json.tool \
            .athena/receipts/w27-w31-five-wave-protocol.json >/dev/null
          python -m json.tool \
            .athena/receipts/w32-next-octave-authority-quorum.json >/dev/null
          python -m json.tool \
            MCP/data/w11_source_mounts.json >/dev/null
          python -m json.tool \
            MCP/data/w14_memory_digest_capsules.json >/dev/null
          python -m json.tool \
            MCP/data/w16_replay_authority_ledger.json >/dev/null
          python -m json.tool \
            MCP/data/w15_blind_replay_ingress.json >/dev/null
          python -m json.tool \
            MCP/data/w16_replay_ledger.json >/dev/null
          python -m json.tool \
            MCP/data/w17_evidence_provenance_gate.json >/dev/null
          python -m json.tool \
            MCP/data/w18_provider_adapter_witness_return.json >/dev/null
          python -m json.tool \
            MCP/data/w18_provider_trust_registry.json >/dev/null
          python -m json.tool \
            MCP/data/w19_provider_admission_execution.json >/dev/null
          python -m json.tool \
            MCP/data/w20_persistent_return_ic10.json >/dev/null
          python -m json.tool \
            MCP/data/w21_ledger_commit_promotion_handoff.json >/dev/null
          python -m json.tool \
            MCP/data/w22_independent_authority_return.json >/dev/null
          python -m json.tool \
            MCP/data/w23_promotion_execution_handoff.json >/dev/null
          python -m json.tool \
            MCP/data/w24_execution_deployment_rollback_readback.json >/dev/null
          python -m json.tool \
            MCP/data/w25_persistent_promotion_settlement.json >/dev/null
          python -m json.tool \
            MCP/data/w26_control_ledger_ic10_review.json >/dev/null
          python -m json.tool \
            MCP/data/w27_w31_five_wave_closure.json >/dev/null
          python -m json.tool \
            MCP/data/w32_next_octave_authority_quorum.json >/dev/null
          python -m json.tool \
            tests/fixtures/w20_control_protocol_admission.json >/dev/null
          python -m py_compile \
            MCP/athena_http_server.py \
            MCP/crystal_108d/source_mounts.py \
            MCP/crystal_108d/memory_digest_capsules.py \
            MCP/crystal_108d/replay_authority_ledger.py \
            MCP/crystal_108d/capsule_replay_ingress.py \
            MCP/crystal_108d/capsule_index_repair.py \
            MCP/crystal_108d/evidence_provenance_gate.py \
            MCP/crystal_108d/provider_adapter_witness_return.py \
            MCP/crystal_108d/provider_trust_anchor.py \
            MCP/crystal_108d/provider_admission_execution.py \
            MCP/crystal_108d/persistent_return_ic10.py \
            MCP/crystal_108d/ledger_commit_promotion_handoff.py \
            MCP/crystal_108d/independent_authority_return.py \
            MCP/crystal_108d/promotion_execution_handoff.py \
            MCP/crystal_108d/execution_deployment_rollback_readback.py \
            MCP/crystal_108d/persistent_promotion_settlement.py \
            MCP/crystal_108d/control_ledger_ic10_review.py \
            MCP/crystal_108d/five_wave_review_closure.py \
            MCP/crystal_108d/next_octave_authority_quorum.py \
            MCP/http_security.py \
            scripts/host_attestation.py \
            scripts/probe_mcp_host.py \
            scripts/p07_mcp_host_witness.py \
            scripts/w19_provider_admission.py \
            scripts/w20_persistent_return_ic10.py \
            scripts/w21_ledger_commit_promotion_handoff.py \
            scripts/w22_independent_authority_return.py \
            scripts/w23_promotion_execution_handoff.py \
            scripts/w24_execution_deployment_rollback_readback.py \
            scripts/w25_persistent_promotion_settlement.py \
            scripts/w26_control_ledger_ic10_review.py \
            scripts/w27_w31_five_wave_closure.py \
            scripts/w32_next_octave_authority_quorum.py
          python scripts/w19_provider_admission.py --check-snapshot
          python scripts/w20_persistent_return_ic10.py --check-snapshot
          python scripts/w21_ledger_commit_promotion_handoff.py --check-snapshot
          python scripts/w22_independent_authority_return.py --check-snapshot
          python scripts/w23_promotion_execution_handoff.py --check-snapshot
          python scripts/w24_execution_deployment_rollback_readback.py --check-snapshot
          python scripts/w25_persistent_promotion_settlement.py --check-snapshot
          python scripts/w26_control_ledger_ic10_review.py --check-snapshot
          python scripts/w27_w31_five_wave_closure.py --check-snapshot
          python scripts/w32_next_octave_authority_quorum.py --check-snapshot

      - name: Run fail-closed HTTP boundary tests
        run: python -m unittest tests.test_http_host -v

      - name: Capture exact-head MCP stdio witness
        env:
          WITNESSED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/p07_mcp_host_witness.py \
            --output p08-stdio-witness.json \
            --timeout 120

      - name: Run federation and registration regressions
        run: |
          ATHENA_ROOT="$GITHUB_WORKSPACE" \
            python -m pytest \
              tests/test_federation_v2.py \
              tests/test_registration.py \
              tests/test_w11_source_mounts.py \
              tests/test_w12_live_provider_receipt.py \
              tests/test_w13_memory_endpoint_gate.py \
              tests/test_w14_memory_digest_capsules.py \
              tests/test_w12_cross_lineage_unification.py \
              tests/test_w14_memory_digest_capsule.py \
              tests/test_w14_control_return_closure.py \
              tests/test_w15_capsule_blind_replay.py \
              tests/test_w15_endpoint_binding_reconciliation.py \
              tests/test_w16_replay_authority_ledger.py \
              tests/test_w15_capsule_replay_ingress.py \
              tests/test_w16_capsule_index_repair.py \
              tests/test_w17_evidence_provenance_gate.py \
              tests/test_w18_provider_adapter_witness_return.py \
              tests/test_w18_provider_trust_anchor.py \
              tests/test_w18_provider_trust_convergence.py \
              tests/test_w19_provider_admission_execution.py \
              tests/test_w20_persistent_return_ic10.py \
              tests/test_w21_ledger_commit_promotion_handoff.py \
              tests/test_w22_independent_authority_return.py \
              tests/test_w23_promotion_execution_handoff.py \
              tests/test_w24_execution_deployment_rollback_readback.py \
              tests/test_w25_persistent_promotion_settlement.py \
              tests/test_w26_control_ledger_ic10_review.py \
              tests/test_w27_w31_five_wave_closure.py \
              tests/test_w32_next_octave_authority_quorum.py \
              -q

      - name: Build immutable candidate image
        run: |
          docker build -f Dockerfile.mcp \
            --build-arg ATHENA_BUILD_COMMIT="$CANDIDATE_COMMIT" \
            -t athena-mcp:p08 .
          docker image inspect athena-mcp:p08 > p08-image.json

      - name: Smoke-test container attestation
        run: |
          docker run --rm -d \
            --name athena-p08 \
            -e ATHENA_MCP_BEARER_TOKEN=0123456789abcdef0123456789abcdef \
            -p 18080:8080 \
            athena-mcp:p08
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from urllib.request import urlopen

          candidate = os.environ["CANDIDATE_COMMIT"]
          last_error = None
          for _ in range(30):
              try:
                  with urlopen("http://127.0.0.1:18080/healthz", timeout=2) as response:
                      health = json.load(response)
                  assert health["status"] == "ready"
                  assert health["deployed_commit"] == candidate
                  assert health["commit_attested"] is True
                  assert health["commit_source"] == "build-locked-file"
                  assert health["promotion_ready"] is False
                  Path("p08-health.json").write_text(
                      json.dumps(health, indent=2, sort_keys=True) + "\n",
                      encoding="utf-8",
                  )
                  break
              except Exception as error:
                  last_error = error
                  time.sleep(1)
          else:
              raise RuntimeError(f"container did not become ready: {last_error}")
          PY

      - name: Stop candidate container
        if: always()
        run: docker stop athena-p08 2>/dev/null || true

      - name: Assemble immutable candidate witness
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          candidate = os.environ["CANDIDATE_COMMIT"]
          stdio = json.loads(Path("p08-stdio-witness.json").read_text())
          health = json.loads(Path("p08-health.json").read_text())
          image = json.loads(Path("p08-image.json").read_text())[0]
          body = {
              "schema": "athena.persistent-mcp-candidate-witness/v1",
              "phase": "P08",
              "verdict": "PASS_RECONCILED_CANDIDATE_NOT_DEPLOYED",
              "candidate_commit": candidate,
              "integration_merge_commit": "e705aaed854b3c17f0f5323a9f299d1a2257f8a7",
              "parents": [
                  "3b32a648e41edc75f7a8d048e84a35948cff3a4c",
                  "2f79ddf0f513777b121290c44bd53e1d63d27d7f",
              ],
              "stdio_witness": {
                  "receipt_id": stdio["receipt_id"],
                  "verdict": stdio["verdict"],
                  "witnessed_commit": stdio["witnessed_commit"],
                  "checks": stdio["checks"],
              },
              "container": {
                  "image_id": image["Id"],
                  "health": health,
                  "published": False,
                  "persistent_endpoint": False,
              },
              "promotion_claimed": False,
              "merge_claimed": False,
              "next_gate": (
                  "Deploy this exact immutable image to an authorized HTTPS MCP "
                  "host and replay scripts/probe_mcp_host.py."
              ),
          }
          canonical = json.dumps(
              body, ensure_ascii=False, sort_keys=True, separators=(",", ":")
          ).encode("utf-8")
          witness = {
              "receipt_id": "p08-candidate:sha256:"
              + hashlib.sha256(canonical).hexdigest(),
              **body,
          }
          Path("p08-integration-witness.json").write_text(
              json.dumps(witness, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(witness, indent=2, sort_keys=True))
          PY

      - name: Upload immutable candidate witness
        uses: actions/upload-artifact@v4
        with:
          name: p08-integration-witness-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            p08-integration-witness.json
            p08-stdio-witness.json
            p08-health.json
          if-no-files-found: error
          retention-days: 90
