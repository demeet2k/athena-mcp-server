name: SCC clean bootstrap

on:
  push:
    branches:
      - athena/synaptic-context-capsule-v1
    paths:
      - .github/workflows/scc-clean-bootstrap.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: athena/synaptic-context-capsule-v1
          fetch-depth: 0
      - name: Remove abandoned transport cells
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch .athena/bootstrap
          git rm --ignore-unmatch .github/workflows/scc-clean-bootstrap.yml
          git config user.name "athena-synapse-bot"
          git config user.email "athena-synapse-bot@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No bootstrap files remain."
            exit 0
          fi
          git commit -m "chore: remove abandoned SCC transport cells"
          git push origin HEAD:athena/synaptic-context-capsule-v1
