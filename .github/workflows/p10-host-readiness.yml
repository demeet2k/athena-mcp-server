name: Validate P10 persistent host capsule

on:
  pull_request:
    branches:
      - agent/p09-published-mcp-image
      - agent/p10-persistent-host-capsule
      - agent/p10-canonical-witness-hardening
  workflow_dispatch:
    inputs:
      activation_packet_json:
        description: Strict secret-free athena.persistent-host-activation-packet/v1 JSON
        required: true
        type: string
      execute_live_witness:
        description: Cross the protected live endpoint after preflight
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

env:
  P09_HEAD: 9731b24c5963b75821b381b4562aa51baa55196c
  SOURCE_COMMIT: 52d0e2abf282aee5f8bf233521989bc2c8969989
  IMAGE: ghcr.io/demeet2k/athena-mcp-server@sha256:31458783d4aeb28e0a4036cb4fab39a2f2bc1f4ef6e3025d126c78a865162ad2

jobs:
  capsule-readiness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact capsule head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate contracts and tests
        run: |
          test "$(git merge-base "$P09_HEAD" HEAD)" = "$P09_HEAD"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$P09_HEAD"
          python -m json.tool deploy/p10/target.schema.json >/dev/null
          python -m json.tool deploy/p10/provider-evidence.example.json >/dev/null
          python -m json.tool deploy/p10/activation-packet.example.json >/dev/null
          python -m json.tool \
            .athena/receipts/p10-host-readiness.json >/dev/null
          python -m py_compile \
            scripts/p10_contract.py \
            scripts/p10_persistent_witness.py \
            scripts/p10_provider_evidence.py \
            scripts/p10_persistent_observation_window.py \
            scripts/p10_activation_packet.py
          python -m scripts.p10_activation_packet \
            deploy/p10/activation-packet.example.json \
            --check-template
          python -m unittest \
            tests.test_p10_deployment_capsule \
            tests.test_p10_persistence_hardening \
            tests.test_p10_activation_packet \
            tests.test_p10_deep_hardening \
            -v
          ATHENA_MCP_BEARER_TOKEN=0123456789abcdef0123456789abcdef \
            docker compose -f deploy/p10/compose.yaml config >/dev/null

      - name: Check diff and secret boundary
        run: |
          git diff --check "$P09_HEAD"...HEAD
          if git diff --unified=0 "$P09_HEAD"...HEAD |
            grep -E 'ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|Bearer [A-Za-z0-9._~+/-]{32,}'; then
            echo "possible secret material found in P10 diff" >&2
            exit 1
          fi

      - name: Authenticate for exact-digest pull
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Smoke-test exact capsule image
        run: |
          docker pull "$IMAGE"
          docker run --rm -d \
            --name athena-p10-readiness \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:size=64m,mode=1777 \
            -e ATHENA_MCP_BEARER_TOKEN=0123456789abcdef0123456789abcdef \
            -p 127.0.0.1:18082:8080 \
            "$IMAGE"
          python - <<'PY'
          import json
          import os
          import time
          from urllib.request import urlopen

          expected = os.environ["SOURCE_COMMIT"]
          last_error = None
          for _ in range(45):
              try:
                  with urlopen(
                      "http://127.0.0.1:18082/healthz",
                      timeout=2,
                  ) as response:
                      health = json.load(response)
                  assert health["deployed_commit"] == expected
                  assert health["commit_source"] == "build-locked-file"
                  assert health["promotion_ready"] is False
                  break
              except Exception as error:
                  last_error = error
                  time.sleep(1)
          else:
              raise RuntimeError(f"capsule image was not ready: {last_error}")
          PY
          test "$(docker exec athena-p10-readiness id -u)" = "10001"

      - name: Stop readiness container
        if: always()
        run: docker stop athena-p10-readiness 2>/dev/null || true

  activation-preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact handoff compiler
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Compile secret-free activation handoff
        env:
          ATHENA_ACTIVATION_PACKET_JSON: ${{ inputs.activation_packet_json }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          Path("p10-activation-packet.json").write_text(
              os.environ["ATHENA_ACTIVATION_PACKET_JSON"] + "\n",
              encoding="utf-8",
          )
          PY
          python -m scripts.p10_activation_packet \
            p10-activation-packet.json \
            --target-out p10-target.json \
            --evidence-out p10-provider-evidence.json \
            --receipt-out p10-activation-handoff.json

      - name: Upload compiled non-secret handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p10-activation-preflight-${{ github.sha }}
          path: |
            p10-target.json
            p10-provider-evidence.json
            p10-activation-handoff.json
          if-no-files-found: error
          retention-days: 90

  persistent-witness:
    needs: activation-preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.execute_live_witness == true
    environment: p10-persistent-host
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact handoff compiler
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "mcp[cli]==1.28.1" \
            "httpx==0.28.1" \
            "starlette==0.48.0" \
            "uvicorn==0.35.0"

      - name: Recompile exact authorized handoff
        env:
          ATHENA_ACTIVATION_PACKET_JSON: ${{ inputs.activation_packet_json }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          Path("p10-activation-packet.json").write_text(
              os.environ["ATHENA_ACTIVATION_PACKET_JSON"] + "\n",
              encoding="utf-8",
          )
          PY
          python -m scripts.p10_activation_packet \
            p10-activation-packet.json \
            --target-out p10-target.json \
            --evidence-out p10-provider-evidence.json \
            --receipt-out p10-activation-handoff.json

      - name: Replay live persistent endpoint
        env:
          ATHENA_MCP_BEARER_TOKEN: ${{ secrets.ATHENA_MCP_BEARER_TOKEN }}
        run: |
          python -m scripts.p10_persistent_observation_window \
            p10-target.json \
            --provider-evidence p10-provider-evidence.json \
            --output p10-persistent-witness.json \
            --samples 3 \
            --interval 20 \
            --per-sample-timeout 180

      - name: Verify legal secret-free witness
        env:
          ATHENA_MCP_BEARER_TOKEN: ${{ secrets.ATHENA_MCP_BEARER_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          token = os.environ["ATHENA_MCP_BEARER_TOKEN"]
          paths = (
              Path("p10-target.json"),
              Path("p10-provider-evidence.json"),
              Path("p10-activation-handoff.json"),
              Path("p10-persistent-witness.json"),
          )
          for path in paths:
              content = path.read_text(encoding="utf-8")
              assert token not in content
              json.loads(content)
          witness = json.loads(paths[-1].read_text(encoding="utf-8"))
          assert witness["verdict"] == "PASS_PERSISTENT_HTTPS_WITNESS"
          assert witness["authority"]["persistent_endpoint_witnessed"] is True
          assert witness["promotion_ready"] is False
          assert witness["promotion_claimed"] is False
          assert witness["merge_claimed"] is False
          PY

      - name: Upload non-secret handoff and witness
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p10-persistent-witness-${{ github.sha }}
          path: |
            p10-target.json
            p10-provider-evidence.json
            p10-activation-handoff.json
            p10-persistent-witness.json
          if-no-files-found: error
          retention-days: 90
