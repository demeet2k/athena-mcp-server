name: MMLG2 mount runtime

on:
  push:
    branches:
      - agent/meta-harness-2-mmlg2-mcp
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mmlg2-mount-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mount:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact runtime branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/meta-harness-2-mmlg2-mcp
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Patch exact registration seam
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('MCP/athena_mcp_server.py')
          text = path.read_text(encoding='utf-8')
          marker = 'register_whole_crystal_autofill(mcp)\n'
          addition = '''register_whole_crystal_autofill(mcp)

# ── Meta Harness 2 / MMLG.2 evidence-gated local learning game ────
from crystal_108d.meta_ml_game_v2 import register_meta_ml_game_v2
register_meta_ml_game_v2(mcp)
'''
          if 'register_meta_ml_game_v2(mcp)' in text:
              raise SystemExit('MMLG.2 registration already present')
          if text.count(marker) != 1:
              raise SystemExit(f'expected one exact registration seam, found {text.count(marker)}')
          path.write_text(text.replace(marker, addition), encoding='utf-8')
          PY
          python -m py_compile MCP/athena_mcp_server.py MCP/crystal_108d/meta_ml_game_v2.py tests/test_meta_ml_game_v2_mcp.py
      - name: Run direct MMLG2 acceptance
        run: |
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation --editable .
          python -m pytest -q tests/test_meta_ml_game_v2_mcp.py
      - name: Commit exact mount
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MCP/athena_mcp_server.py
          git commit -m 'Register Meta Harness 2 MMLG v2 in MCP host'
          git push origin HEAD:agent/meta-harness-2-mmlg2-mcp
