name: ATHENA Deployment V2

on:
  push:
    branches: [agent/athena-3.2-deployment-control-plane-v2]
    paths:
      - athena_mcp/deployment.py
      - athena_mcp/deployment_protocol.py
      - athena_mcp/deployment_extension.py
      - athena_mcp/deployment_cutover.py
      - athena_mcp/deployment_cutover_protocol.py
      - athena_mcp/deployment_cutover_extension.py
      - athena_mcp/http_host.py
      - athena_mcp/__init__.py
      - deploy/**
      - spec/DEPLOYMENT_CUTOVER_HOLD_V1.md
      - tests/fixtures/deployment/canary-witness.v3.3.0.json
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - tests/test_deployment_contract_v2.py
      - tests/test_deployment_integration_v2.py
      - tests/test_deployment_cutover_hold_v1.py
      - tests/test_http_host_v2.py
      - .github/workflows/deployment-v2.yml
  pull_request:
    branches: [master]
    paths:
      - athena_mcp/deployment.py
      - athena_mcp/deployment_protocol.py
      - athena_mcp/deployment_extension.py
      - athena_mcp/deployment_cutover.py
      - athena_mcp/deployment_cutover_protocol.py
      - athena_mcp/deployment_cutover_extension.py
      - athena_mcp/http_host.py
      - athena_mcp/__init__.py
      - deploy/**
      - spec/DEPLOYMENT_CUTOVER_HOLD_V1.md
      - tests/fixtures/deployment/canary-witness.v3.3.0.json
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - tests/test_deployment_contract_v2.py
      - tests/test_deployment_integration_v2.py
      - tests/test_deployment_cutover_hold_v1.py
      - tests/test_http_host_v2.py
      - .github/workflows/deployment-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: athena-deployment-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile all Python sources
        run: python -m compileall -q athena_mcp deploy tests

      - name: Run complete repository unit corpus
        run: python -m unittest discover -s tests -v

      - name: Build and clean-install wheel
        shell: bash
        run: |
          python -m pip wheel --no-deps . -w dist
          rm -rf /tmp/athena-wheel
          python -m pip install --no-deps --target /tmp/athena-wheel dist/*.whl
          cd /tmp
          PYTHONPATH=/tmp/athena-wheel python - <<'PY'
          import tempfile
          import athena_mcp
          from athena_mcp.server import Server

          with tempfile.NamedTemporaryFile(suffix='.db') as handle:
              server=Server(handle.name)
              try:
                  names={item['name'] for item in server.handle(
                      {'jsonrpc':'2.0','id':1,'method':'tools/list'}
                  )['result']['tools']}
                  for required in {
                      'athena_deployment_manifest',
                      'athena_deployment_verify_receipt',
                      'athena_deployment_assess_quiescence',
                      'athena_deployment_cutover_hold',
                      'athena_deployment_verify_cutover_hold',
                  }:
                      assert required in names, required
                  resources={item['uri'] for item in server.handle(
                      {'jsonrpc':'2.0','id':2,'method':'resources/list'}
                  )['result']['resources']}
                  assert 'athena://deployment/cutover-hold' in resources
              finally:
                  server.store.close()
          print('CLEAN PACKAGE DEPLOYMENT PASS', athena_mcp.__version__)
          PY

      - name: Render exact-digest Kubernetes bytes and source SBOM
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          IMAGE="ghcr.io/demeet2k/athena-mcp-server@sha256:$(printf 'a%.0s' {1..64})"
          python deploy/render.py --image "$IMAGE" \
            --output dist/deployment-manifest.yaml \
            --receipt dist/deployment-render-receipt.json
          grep -F "image: $IMAGE" dist/deployment-manifest.yaml
          grep -F "replicas: 1" dist/deployment-manifest.yaml
          grep -F "type: Recreate" dist/deployment-manifest.yaml
          grep -F "readOnlyRootFilesystem: true" dist/deployment-manifest.yaml
          python deploy/sbom.py --root . \
            --output dist/application-sbom.spdx.json \
            --package-version "$VERSION" \
            --source-head "$GITHUB_SHA"
          python - <<'PY'
          import json
          value=json.load(open('dist/application-sbom.spdx.json'))
          assert value['spdxVersion']=='SPDX-2.3'
          assert len(value['files']) > 10
          assert 'does not prove' in value['athenaBoundary']
          print('RENDER + SOURCE SBOM PASS', len(value['files']))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: athena-deployment-v2-source-${{ github.sha }}
          path: |
            dist/*.whl
            dist/deployment-manifest.yaml
            dist/deployment-render-receipt.json
            dist/application-sbom.spdx.json
          if-no-files-found: error

  secure-persistent-container:
    needs: source-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build and inspect non-root OCI image
        shell: bash
        run: |
          docker build --pull --tag athena-deployment-v2:${GITHUB_SHA} .
          test "$(docker image inspect athena-deployment-v2:${GITHUB_SHA} --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect athena-deployment-v2:${GITHUB_SHA} --format '{{json .Config.Healthcheck.Test}}')" != "null"

      - name: Reject remote binding without bearer token
        shell: bash
        run: |
          set +e
          docker run --rm --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            athena-deployment-v2:${GITHUB_SHA} \
            --host 0.0.0.0 --port 8765 --db /var/lib/athena/athena.db --migrate
          code=$?
          set -e
          test "$code" -ne 0

      - name: Write semantic witness through secure container
        shell: bash
        run: |
          TOKEN='athena-ci-deployment-token-0123456789'
          echo "ATHENA_CI_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          docker volume create athena-ci-state
          docker run -d --name athena-ci --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            -e ATHENA_HTTP_TOKEN="$TOKEN" \
            -p 127.0.0.1:18765:8765 \
            -v athena-ci-state:/var/lib/athena \
            athena-deployment-v2:${GITHUB_SHA}
          python deploy/container_smoke.py --base-url http://127.0.0.1:18765 \
            --token "$TOKEN" --state-file /tmp/athena-container-witness.json --mode write
          test "$(docker inspect athena-ci --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
          test "$(docker inspect athena-ci --format '{{.Config.User}}')" = "65532:65532"

      - name: Restart exact image and read persisted witness
        shell: bash
        run: |
          docker rm -f athena-ci
          docker run -d --name athena-ci --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            -e ATHENA_HTTP_TOKEN="$ATHENA_CI_TOKEN" \
            -p 127.0.0.1:18765:8765 \
            -v athena-ci-state:/var/lib/athena \
            athena-deployment-v2:${GITHUB_SHA}
          python deploy/container_smoke.py --base-url http://127.0.0.1:18765 \
            --token "$ATHENA_CI_TOKEN" --state-file /tmp/athena-container-witness.json --mode verify

      - name: Diagnostics and cleanup
        if: always()
        shell: bash
        run: |
          docker ps -a || true
          docker logs athena-ci || true
          docker rm -f athena-ci 2>/dev/null || true
          docker volume rm athena-ci-state 2>/dev/null || true
