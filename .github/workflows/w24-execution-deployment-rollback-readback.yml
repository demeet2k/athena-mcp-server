name: Validate W24 execution deployment rollback returns

on:
  workflow_dispatch:
    inputs:
      return_bundle_b64:
        description: Base64 exact non-secret W24 return-bundle JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-return-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact requested ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        run: python -m pip install "cryptography==47.0.0"

      - name: Pin exact verifier repository ref and parent
        run: |
          test "$GITHUB_REPOSITORY" = "demeet2k/athena-mcp-server"
          test "$GITHUB_REF" = \
            "refs/heads/agent/w15-reconcile-capsule-deep-hardening"
          test "$(git rev-parse HEAD^)" = \
            "5ee30b98e4a6653fcbce65d733513b1e25529ddd"
          test "$(git rev-parse HEAD^{tree})" = \
            "02808be32a3aa76f0c1556b1dd736512b1523485"

      - name: Validate frozen production-empty snapshot
        run: |
          python scripts/w24_execution_deployment_rollback_readback.py \
            --check-snapshot

      - name: Decode bounded non-secret return bundle
        env:
          RETURN_BUNDLE_B64: ${{ inputs.return_bundle_b64 }}
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          decoded = base64.b64decode(
              os.environ["RETURN_BUNDLE_B64"], validate=True
          )
          if len(decoded) > 1048576:
              raise ValueError("W24 bundle exceeds bounded input size")
          Path("w24-return-bundle.json").write_bytes(decoded)
          PY

      - name: Verify coordinate-specific return closure
        run: |
          python scripts/w24_execution_deployment_rollback_readback.py \
            --bundle w24-return-bundle.json \
            --output w24-execution-deployment-rollback-preflight.json \
            --verifier-repository "$GITHUB_REPOSITORY" \
            --verifier-ref "$GITHUB_REF" \
            --verifier-head "$GITHUB_SHA" \
            --verifier-parent-head "$(git rev-parse HEAD^)" \
            --verifier-workflow \
              ".github/workflows/w24-execution-deployment-rollback-readback.yml"

      - name: Upload non-secret validation receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w24-return-preflight-${{ github.sha }}
          path: w24-execution-deployment-rollback-preflight.json
          if-no-files-found: error
          retention-days: 30
