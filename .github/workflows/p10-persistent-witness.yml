name: P10 authorized endpoint and persistent witness

on:
  pull_request:
    # Validate the prepared capsule once when its draft PR opens. GitHub
    # evaluates PR path filters against the cumulative PR diff, so restricting
    # to `opened` is what prevents later receipt-only commits from retriggering
    # this hosted readiness job. Real witnesses remain workflow_dispatch-only.
    types: [opened]
    branches:
      - agent/p09-published-mcp-image
    paths:
      - .github/workflows/p10-persistent-witness.yml
      - deploy/p10/**
      - scripts/p10_contract.py
      - scripts/p10_preflight.py
      - scripts/p10_persistent_witness.py
      - tests/test_http_host.py
      - tests/test_p10_authorized_endpoint.py
      - tests/test_registration.py
  workflow_dispatch:
    inputs:
      endpoint:
        description: Authorized persistent HTTPS endpoint ending exactly in /mcp
        required: true
        type: string
      provider_id:
        description: Authorized host/provider identifier
        required: true
        type: string
      provider_account_scope:
        description: Authorized logical account or tenant scope
        required: true
        type: string
      deployment_id:
        description: Persistent deployment identifier
        required: true
        type: string
      persistence_class:
        description: Authorized persistent container class
        required: true
        type: choice
        options:
          - managed-container-service
          - orchestrated-container-service
          - self-hosted-container-service
      authorization_ref:
        description: Change-control or authority reference
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  P09_HEAD: 9731b24c5963b75821b381b4562aa51baa55196c
  SOURCE_COMMIT: 52d0e2abf282aee5f8bf233521989bc2c8969989
  IMAGE: ghcr.io/demeet2k/athena-mcp-server@sha256:31458783d4aeb28e0a4036cb4fab39a2f2bc1f4ef6e3025d126c78a865162ad2

jobs:
  prepared-capsule:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact P10 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact verification dependencies
        run: |
          python -m pip install \
            "mcp[cli]==1.28.1" \
            "httpx==0.28.1" \
            "pytest==8.4.2" \
            "starlette==0.48.0" \
            "uvicorn==0.35.0" \
            "PyYAML==6.0.2"

      - name: Verify exact P09 ancestry
        run: |
          test "$(git merge-base "$P09_HEAD" HEAD)" = "$P09_HEAD"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$P09_HEAD"

      - name: Parse JSON and YAML surfaces
        run: |
          python -m json.tool deploy/p10/host-contract.json >/dev/null
          python -m json.tool \
            .athena/receipts/p10-authorized-endpoint-readiness.json >/dev/null
          python -m json.tool .athena/status.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in (
              Path("deploy/p10/compose.yaml"),
              Path(".github/workflows/p10-persistent-witness.yml"),
          ):
              value = yaml.safe_load(path.read_text(encoding="utf-8"))
              assert isinstance(value, dict)
          PY

      - name: Compile and run P10 tests
        run: |
          python -m py_compile \
            scripts/p10_contract.py \
            scripts/p10_preflight.py \
            scripts/p10_persistent_witness.py \
            tests/test_p10_authorized_endpoint.py
          python -m unittest tests.test_p10_authorized_endpoint -v

      - name: Re-run inherited P07 and P08 boundaries
        env:
          ATHENA_ROOT: ${{ github.workspace }}
        run: |
          python -m unittest tests.test_http_host -v
          python -m pytest \
            tests/test_federation_v2.py \
            tests/test_registration.py \
            -q
          python scripts/p07_mcp_host_witness.py \
            --output p10-local-stdio-witness.json \
            --timeout 120

      - name: Validate null-authority deployment preflight
        run: |
          python scripts/p10_preflight.py validate \
            deploy/p10/host-contract.json \
            --mode prepared \
            --output p10-prepared-preflight.json
          test "$(python -c 'import json; print(json.load(open("p10-prepared-preflight.json"))["verdict"])')" = \
            "READY_AWAITING_AUTHORIZED_TARGET"

      - name: Validate Compose contract
        env:
          ATHENA_MCP_BEARER_TOKEN: p10-offline-test-only-000000000000
        run: docker compose -f deploy/p10/compose.yaml config >/dev/null

      - name: Authenticate for exact-digest pull
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and smoke-test the exact P09 digest
        run: |
          docker pull "$IMAGE"
          docker run --rm -d \
            --name athena-p10-offline-capsule \
            --user 10001:10001 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:size=64m,mode=1777 \
            -e ATHENA_MCP_BEARER_TOKEN=p10-offline-test-only-000000000000 \
            -p 127.0.0.1:18082:8080 \
            "$IMAGE"
          python - <<'PY'
          import json
          import os
          import time
          from urllib.request import urlopen

          last_error = None
          for _ in range(45):
              try:
                  with urlopen(
                      "http://127.0.0.1:18082/healthz", timeout=2
                  ) as response:
                      health = json.load(response)
                  assert health["status"] == "ready"
                  assert health["deployed_commit"] == os.environ["SOURCE_COMMIT"]
                  assert health["commit_source"] == "build-locked-file"
                  assert health["promotion_ready"] is False
                  break
              except Exception as error:
                  last_error = error
                  time.sleep(1)
          else:
              raise RuntimeError(
                  f"exact digest did not become ready: {last_error}"
              )
          PY
          test "$(docker exec athena-p10-offline-capsule id -u)" = "10001"
          test "$(docker exec athena-p10-offline-capsule cat /app/.athena-deployed-commit)" = \
            "$SOURCE_COMMIT"

      - name: Stop offline capsule
        if: always()
        run: docker stop athena-p10-offline-capsule 2>/dev/null || true

      - name: Scan intended diff and generated artifacts for secret material
        run: |
          git diff --check "$P09_HEAD"...HEAD
          if git diff --unified=0 "$P09_HEAD"...HEAD |
            grep -E 'ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|Bearer [A-Za-z0-9._~+/-]{32,}'; then
            echo "possible secret material found in P10 diff" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path("p10-prepared-preflight.json"),
              Path("p10-local-stdio-witness.json"),
          ):
              json.loads(path.read_text(encoding="utf-8"))
          PY

      - name: Upload only secret-free readiness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p10-authorized-endpoint-readiness-${{ github.event.pull_request.head.sha }}
          path: |
            p10-prepared-preflight.json
            p10-local-stdio-witness.json
          if-no-files-found: error
          retention-days: 90

  persistent-witness:
    if: github.event_name == 'workflow_dispatch'
    environment: p10-persistent-host
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact P10 witness implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact witness dependencies
        run: |
          python -m pip install \
            "mcp[cli]==1.28.1" \
            "httpx==0.28.1" \
            "starlette==0.48.0" \
            "uvicorn==0.35.0"

      - name: Verify exact contract lineage and record authorization time
        run: |
          git merge-base --is-ancestor "$P09_HEAD" HEAD
          python scripts/p10_preflight.py validate \
            deploy/p10/host-contract.json \
            --mode prepared \
            --output p10-prepared-preflight.json
          echo "ATHENA_P10_AUTHORIZED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            >> "$GITHUB_ENV"

      - name: Materialize secret-free authorized target contract
        env:
          ATHENA_MCP_BEARER_TOKEN: ${{ secrets.ATHENA_MCP_BEARER_TOKEN }}
          ATHENA_P10_ENDPOINT: ${{ inputs.endpoint }}
          ATHENA_P10_PROVIDER_ID: ${{ inputs.provider_id }}
          ATHENA_P10_PROVIDER_ACCOUNT_SCOPE: ${{ inputs.provider_account_scope }}
          ATHENA_P10_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          ATHENA_P10_PERSISTENCE_CLASS: ${{ inputs.persistence_class }}
          ATHENA_P10_AUTHORIZATION_REF: ${{ inputs.authorization_ref }}
          ATHENA_P10_AUTHORIZED_BY: ${{ github.actor }}
          ATHENA_P10_SECRET_STORE_REF: github-environment:p10-persistent-host/ATHENA_MCP_BEARER_TOKEN
        run: |
          python scripts/p10_preflight.py materialize-authorized \
            deploy/p10/host-contract.json \
            --output p10-authorized-host-contract.json
          python scripts/p10_preflight.py validate \
            p10-authorized-host-contract.json \
            --mode authorized \
            --output p10-authorized-preflight.json

      - name: Probe real persistent HTTPS endpoint
        env:
          ATHENA_MCP_BEARER_TOKEN: ${{ secrets.ATHENA_MCP_BEARER_TOKEN }}
        run: |
          python scripts/p10_persistent_witness.py \
            p10-authorized-host-contract.json \
            --samples 3 \
            --interval 5 \
            --output p10-persistent-witness.json

      - name: Verify legal verdict and scan outputs against the secret
        env:
          ATHENA_MCP_BEARER_TOKEN: ${{ secrets.ATHENA_MCP_BEARER_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          token = os.environ["ATHENA_MCP_BEARER_TOKEN"]
          paths = (
              Path("p10-authorized-host-contract.json"),
              Path("p10-authorized-preflight.json"),
              Path("p10-persistent-witness.json"),
          )
          for path in paths:
              content = path.read_text(encoding="utf-8")
              assert token not in content
              json.loads(content)
          receipt = json.loads(paths[-1].read_text(encoding="utf-8"))
          assert receipt["verdict"] == "PASS_PERSISTENT_HTTPS_WITNESS"
          assert receipt["authority"]["persistent_https_witness"] is True
          assert receipt["authority"]["promotion_ready"] is False
          assert receipt["authority"]["promotion_claimed"] is False
          PY

      - name: Upload only secret-free target and witness receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p10-persistent-https-witness-${{ github.sha }}
          path: |
            p10-authorized-host-contract.json
            p10-authorized-preflight.json
            p10-persistent-witness.json
          if-no-files-found: error
          retention-days: 90
