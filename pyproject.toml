[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-canonical-mcp"
version = "2.9.0"
description = "Canonical KC144/JSPACE/SCALE developmental control, nonlinear probabilistic inference, causal estimation, and finite belief control substrate"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
athena-mcp = "athena_mcp.server:main"

[tool.setuptools.packages.find]
include = ["athena_mcp*"]
