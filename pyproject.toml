[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-canonical-mcp"
version = "2.3.0"
description = "Canonical KC144/JSPACE/SCALE developmental control substrate with digest-bound registry crystal"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
athena-mcp = "athena_mcp.hub_server:main"

[tool.setuptools.packages.find]
include = ["athena_mcp*"]

[tool.setuptools.package-data]
athena_mcp = ["data/*.xz"]
