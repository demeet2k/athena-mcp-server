[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-canonical-mcp"
version = "3.0.0"
description = "Canonical KC144/JSPACE/SCALE developmental control with adaptive probabilistic inference, causal sensitivity, finite belief-state planning, and witnessed whole-system release control"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
athena-mcp = "athena_mcp.hub_server:main"

[tool.setuptools.packages.find]
include = ["athena_mcp*"]

[tool.setuptools.package-data]
athena_mcp = ["data/*.xz"]
