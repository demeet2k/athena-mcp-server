[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-canonical-mcp"
version = "3.5.0"
description = "Canonical KC144/JSPACE/SCALE developmental control with bounded ordered-DAG posterior inference, multistage cross-fitted longitudinal DR, finite Gaussian-mixture belief, learned approximation-error fields, and coupled finite-model robust policy evaluation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
athena-mcp = "athena_mcp.server:main"

[tool.setuptools.packages.find]
include = ["athena_mcp*"]
