services:
  athena:
    image: ${ATHENA_IMAGE:?Set ATHENA_IMAGE to an exact repository@sha256 digest}
    user: "65532:65532"
    read_only: true
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      ATHENA_DB: /var/lib/athena/athena.db
      ATHENA_HTTP_HOST: 0.0.0.0
      ATHENA_HTTP_PORT: "8765"
      ATHENA_HTTP_TOKEN_FILE: /run/secrets/athena_http_token
      ATHENA_MIGRATE: "true"
    secrets:
      - athena_http_token
    volumes:
      - athena_state:/var/lib/athena
    ports:
      - "127.0.0.1:${ATHENA_HTTP_PORT:-8765}:8765"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/readyz', timeout=3).read()
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

volumes:
  athena_state:

secrets:
  athena_http_token:
    file: ${ATHENA_HTTP_TOKEN_FILE:?Set ATHENA_HTTP_TOKEN_FILE to a local secret file}
